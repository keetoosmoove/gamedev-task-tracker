<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDev Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>GameDev Task Tracker</h1>
    <div id="user-bar" class="user-bar hidden">
      <span id="user-email"></span>
      <button type="button" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main>
    <section id="auth-section" class="card hidden">
      <h2 id="auth-title">Log In</h2>
      <form id="auth-form">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" required autocomplete="email" placeholder="you@example.com">

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters">

        <div class="actions">
          <button type="submit" id="auth-submit" class="primary">Log In</button>
        </div>
      </form>
      <p id="auth-message" class="auth-message hidden"></p>
      <p class="auth-switch">
        <span id="auth-switch-text">Don't have an account?</span>
        <button type="button" id="auth-switch-btn" class="link">Register</button>
      </p>
    </section>

    <div id="app-section" class="hidden">
    <section class="card">
      <h2 id="form-title">Add Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">

        <label for="title">Title</label>
        <input type="text" id="title" required maxlength="100" placeholder="e.g. Implement player jump">

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Details, notes, acceptance criteria..."></textarea>

        <div class="row">
          <div>
            <label for="due-date">Due Date</label>
            <input type="date" id="due-date">
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn" class="primary">Add Task</button>
          <button type="button" id="cancel-btn" class="hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Tasks</h2>
        <select id="filter">
          <option value="All">All</option>
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <ul id="task-list"></ul>
      <p id="empty-message" class="empty">No tasks yet. Add one above!</p>
    </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
