<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameDev Task Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>GameDev Task Tracker</h1>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id">

        <label for="title">Title</label>
        <input type="text" id="title" required maxlength="100" placeholder="e.g. Implement player jump">

        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Details, notes, acceptance criteria..."></textarea>

        <div class="row">
          <div>
            <label for="due-date">Due Date</label>
            <input type="date" id="due-date">
          </div>
          <div>
            <label for="status">Status</label>
            <select id="status">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submit-btn" class="primary">Add Task</button>
          <button type="button" id="cancel-btn" class="hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Tasks</h2>
        <select id="filter">
          <option value="All">All</option>
          <option value="To Do">To Do</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>
      <ul id="task-list"></ul>
      <p id="empty-message" class="empty">No tasks yet. Add one above!</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
